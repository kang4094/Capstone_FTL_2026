#
# SimpleSSD-Standalone Configuration
# SNIA IOtta (Nexus5) Trace Replay Mode
# 원본: WorkSpace_nexus5-sample.txt  ->  변환: WorkSpace_nexus5-sample_simplessd.txt
#

[global]

## Trace replayer mode (0=generator, 1=trace)
Mode = 1

LogPeriod = 10
LogFile = STDOUT
DebugLogFile = STDERR
LatencyLogFile =
ProgressPeriod = 0

## Interface = 0: FTL 성능 측정에 집중
Interface = 0
Scheduler = 0

SubmissionLatency = 5us
CompletionLatency = 5us

# [generator] 섹션은 Mode=1에서 무시됨
[generator]
io_size = 16M
readwrite = read
rwmixread = 0.5
blocksize = 4K
blockalign =
iomode = async
iodepth = 32
offset = 0
size =
thinktime = 0
randseed = 13245
time_based = 0
runtime = 10s

# Trace replayer 설정
[trace]

## 변환된 트레이스 파일 경로
## SimpleSSD-Standalone 실행 디렉토리 기준 경로
File = ./WorkSpace_nexus5-sample_simplessd.txt

## TimingMode
##   0: 동기 방식 (타이밍 무시) - 동작 확인용
##   1: 비동기 방식 (타이밍 무시, QueueDepth 동시 발행)
##   2: Strict timing (실제 워크로드 재현) <- 권장
TimingMode = 2

QueueDepth = 32
IOLimit = 0

## 변환된 트레이스 포맷: "0 W 4220896 8"
##  그룹: (1)us  (2)op  (3)sector  (4)count
Regex = "(\d+) (\w) (\d+) (\d+)"

Operation   = 2
ByteOffset  =
ByteLength  =
LBAOffset   = 3
LBALength   = 4
Second      =
Millisecond =
Microsecond = 1
Nanosecond  =
Picosecond  =

## 섹터 크기 (Android eMMC 기본값)
LBASize = 512
UseHexadecimal = 0
